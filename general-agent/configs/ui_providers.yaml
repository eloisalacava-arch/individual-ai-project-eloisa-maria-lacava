# ---------------------------------------------------------------------------
# Provider and model allow-list for the Streamlit interface (app/).
#
# The interface only offers models listed here. It never accepts a key, and it
# never reads or displays the value of an environment variable: it only reports
# whether the named variable is present. Add a provider by copying a block.
#
# Fields:
#   id            short identifier used in the session state
#   label         what the dropdown shows
#   provider      engine provider: opencode_cli | openai_compatible
#   enabled       false hides the entry without deleting it (default true)
#   base_url      openai_compatible only
#   api_key_env   openai_compatible only: NAME of the environment variable
#   models[].name exact provider/model string recorded in every log line
#   models[].label        what the dropdown shows
#   models[].price_per_million  catalogue price; a cost guardrail, not billing
#   models[].max_calls    hard ceiling the interface will not exceed
# ---------------------------------------------------------------------------

providers:
  # The first enabled provider is the one the interface selects by default on a
  # fresh session. Keep OpenRouter first so a new user is prompted for an API key
  # rather than a local OpenCode account; the OpenCode CLI stays fully selectable.
  - id: openrouter
    label: "OpenRouter (your own API key)"
    provider: openai_compatible
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    access_note: >-
      Reads the API key from the OPENROUTER_API_KEY environment variable. No
      OpenCode account is needed. Export the key in the shell that starts the
      interface; a .env file is not read automatically.
    models:
      # Model ids and prices verified against https://openrouter.ai/api/v1/models
      # (2026-11-24). Prices are a cost guardrail in USD per million tokens, not
      # a bill. Re-check the catalogue before a run; OpenRouter ids and prices
      # change over time.
      - name: "deepseek/deepseek-chat-v3.1"
        label: "DeepSeek V3.1 (OpenRouter)"
        price_per_million:
          input: 0.25
          output: 0.95
        max_calls: 500
      - name: "deepseek/deepseek-v3.2"
        label: "DeepSeek V3.2 (OpenRouter)"
        price_per_million:
          input: 0.26
          output: 0.38
        max_calls: 500

  - id: opencode
    label: "OpenCode CLI (local)"
    provider: opencode_cli
    enabled: true
    access_note: >-
      Uses the signed-in OpenCode account on this machine. No key is stored by
      this interface, and the provider reports its own per-call cost.
    models:
      - name: openrouter/deepseek/deepseek-v4.1-flash-1017
        label: "DeepSeek V4.1 Flash"
        price_per_million:
          input: 0.036
          output: 0.50
        max_calls: 500
      - name: openrouter/deepseek/deepseek-v4.1
        label: "DeepSeek V4.1"
        price_per_million:
          input: 0.14
          output: 0.28
        max_calls: 500
